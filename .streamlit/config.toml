# Public cloud demo (branch deploy-streamlit-cloud). The offline tool on main binds
# to 127.0.0.1 on port 8501; here the host chooses the address and port.
[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

# The Chiron station's dark palette. No red anywhere: the accent is blue, and
# Streamlit's own red (used for errors) is replaced by amber.
[theme]
base = "dark"
primaryColor = "#2f81f7"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
borderColor = "#2a3038"
redColor = "#d29922"
font = "sans-serif"
