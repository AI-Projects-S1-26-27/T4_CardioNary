# Public cloud demo (branch deploy-streamlit-cloud). The offline tool on main binds
# to 127.0.0.1 on port 8501; here the host chooses the address and port.
[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0645ad"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#212529"
font = "sans serif"
